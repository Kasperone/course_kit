name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test built CLI
        run: |
          node dist/cli.js --help
          tmp="$(mktemp -d)"
          git init -q "$tmp/target"
          git -C "$tmp/target" -c user.name=ci -c user.email=ci@example.invalid commit -q --allow-empty -m init
          node dist/cli.js init "$tmp/target" --out "$tmp/course"
          test -f "$tmp/course/course.json"
          test -f "$tmp/course/.gitignore"
          test -f "$tmp/course/addons/narration/global-top.vue"
          # Narration without Piper or network: a dry run lists the steps, synthesizes nothing.
          node dist/cli.js narrate 01-placeholder -C "$tmp/course" --dry-run
          node dist/cli.js voices list
          # Q&A chat without a key or network: prompt sizes and cost estimate only.
          node dist/cli.js ask 01-placeholder -C "$tmp/course" --dry-run

  deck:
    # Real Slidev build of the committed example workspace (examples/faktura): render-time PlantUML
    # check, the faktura lesson build and the Q&A chat (mock API). No PDF export, no Playwright.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/faktura/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix examples/faktura

      - name: Build CLI
        run: npm run build

      - name: Slidev e2e tests (deck policy, Q&A chat)
        run: npx vitest run tests/slidev-e2e.test.ts tests/chat-e2e.test.ts

      - name: course build (examples/faktura)
        run: |
          node dist/cli.js build -C examples/faktura
          test -f examples/faktura/dist/01-architecture/en/index.html
          test -f examples/faktura/dist/index.html
